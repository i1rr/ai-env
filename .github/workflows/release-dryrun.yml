name: Release (dry run)

# Build the `ai-env` binary for every supported OS/arch combination
# without publishing anything. This catches cross-compile breakage,
# missing build tags, or ldflag mistakes before a real tagged
# release. The job runs on every push/PR to main and on manual
# dispatch; nothing here pushes a tag, creates a GitHub release,
# or uploads to a registry.
#
# Plan reference: plan.md "CI hardening" step 15
# ("Add release dry-run workflow.").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve dry-run version string
        id: version
        run: |
          short_sha=$(git rev-parse --short HEAD)
          echo "version=0.0.0-dryrun+${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build ai-env
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          out="dist/ai-env-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "${out}" \
            ./cmd/ai-env
          ls -lh "${out}"

      - name: Smoke check (linux/amd64 host only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/ai-env-linux-amd64 --version
          ./dist/ai-env-linux-amd64 --help

      - name: Upload dry-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-env-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/ai-env-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7
